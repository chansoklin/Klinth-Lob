<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLINTH LOB · Drift</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .drift-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .drift-form-container {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 1.8rem;
      margin-bottom: 2rem;
    }

    .drift-form-container textarea,
    .drift-form-container input {
      width: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      border: 1px solid var(--border-light);
      border-radius: 18px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      background: var(--bg-primary);
      transition: all 0.2s;
    }

    .drift-form-container textarea:focus,
    .drift-form-container input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(217, 208, 232, 0.3);
    }

    .publish-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }

    .publish-btn:hover {
      background: var(--accent-hover);
    }

    .drift-list {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .drift-card {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 1.5rem;
      transition: all 0.15s;
    }

    .drift-card:hover {
      background: var(--pale-lavender);
      border-color: var(--accent);
    }

    .drift-content {
      font-size: 0.95rem;
      white-space: pre-wrap;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .drift-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.7rem;
      color: var(--text-secondary);
      border-top: 1px dashed var(--border-light);
      padding-top: 0.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .delete-drift {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.7rem;
      font-family: monospace;
      transition: color 0.2s;
    }

    .delete-drift:hover {
      color: #b05e3a;
    }

    .empty-drift {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
      background: var(--pale-lavender);
      border-radius: 40px;
      font-style: italic;
    }

    .type-badge {
      background: var(--pale-lavender);
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      font-size: 0.65rem;
      display: inline-block;
      color: var(--text-secondary);
    }

    .music-card {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      background: var(--bg-primary);
      border-radius: 16px;
      padding: 0.8rem;
      border: 1px solid var(--border-light);
    }

    .music-card-image {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--pale-lavender);
    }

    .music-card-info {
      flex: 1;
    }

    .music-card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .music-card-artist {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }

    .music-card-link {
      display: inline-block;
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: var(--accent);
      text-decoration: none;
    }

    .music-card-link:hover {
      text-decoration: underline;
    }

    .music-attach-section {
      background: var(--pale-lavender);
      border-radius: 18px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .music-attach-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .add-music-btn {
      background: none;
      border: 1px solid var(--border-light);
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      cursor: pointer;
      color: var(--text-secondary);
      font-family: inherit;
      transition: all 0.2s;
    }

    .add-music-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .music-fields {
      display: none;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.8rem;
    }

    .music-fields.active {
      display: flex;
    }

    .remove-music-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.7rem;
      text-align: right;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <h1>
          <a href="begin.html">
            <span class="logo-text">KLINTH</span>
            <span class="logo-lob"> LOB</span>
          </a>
        </h1>
        <p class="tagline">inner place · shared outward</p>
      </div>
      <nav class="main-nav">
        <a href="begin.html">Begin</a>
        <a href="arts.html">Arts</a>
        <a href="craft.html">Craft</a>
        <a href="drift.html" class="active">Drift</a>
        <a href="root.html">Root</a>
      </nav>
      <button id="darkModeToggle" class="dark-mode-btn">Dark</button>
    </div>
  </header>

  <main>
    <div class="drift-container">
      <h1 class="page-title">Drift</h1>
      <div class="section-sub">writing · music · wandering thoughts</div>

      <div class="drift-form-container">
        <textarea id="driftContentInput" rows="3" placeholder="write a drift — poem, fragment, lyric, random thought..."></textarea>
        <input type="text" id="driftTypeInput" placeholder="optional: writing / music / thought" autocomplete="off">
        
        <div class="music-attach-section">
          <div class="music-attach-header">
            <span>◌ attach music</span>
            <button type="button" id="showMusicFieldsBtn" class="add-music-btn">+ add</button>
          </div>
          <div id="musicFields" class="music-fields">
            <input type="text" id="musicTitle" placeholder="song title">
            <input type="text" id="musicArtist" placeholder="artist name">
            <input type="text" id="musicImageUrl" placeholder="image URL (album art)">
            <input type="text" id="musicLinkUrl" placeholder="link (Spotify / YouTube)">
            <button type="button" id="removeMusicBtn" class="remove-music-btn">remove music</button>
          </div>
        </div>

        <button class="publish-btn" id="publishDriftBtn">◌ publish drift ◌</button>
      </div>

      <div id="driftListContainer" class="drift-list"></div>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <p class="footer-message">KLINTH LOB · drift as you are</p>
      <p class="footer-copyright">KLINTH LOB</p>
    </div>
  </footer>

  <script>
    const STORAGE_KEY = 'KLINTHLOB_drifts';

    const showMusicBtn = document.getElementById('showMusicFieldsBtn');
    const musicFields = document.getElementById('musicFields');
    const removeMusicBtn = document.getElementById('removeMusicBtn');

    showMusicBtn?.addEventListener('click', () => musicFields.classList.add('active'));
    removeMusicBtn?.addEventListener('click', () => {
      musicFields.classList.remove('active');
      document.getElementById('musicTitle').value = '';
      document.getElementById('musicArtist').value = '';
      document.getElementById('musicImageUrl').value = '';
      document.getElementById('musicLinkUrl').value = '';
    });

    function getCurrentMusic() {
      const title = document.getElementById('musicTitle')?.value.trim();
      if (!title) return null;
      return {
        title: title,
        artist: document.getElementById('musicArtist')?.value.trim() || '',
        imageUrl: document.getElementById('musicImageUrl')?.value.trim() || '',
        linkUrl: document.getElementById('musicLinkUrl')?.value.trim() || ''
      };
    }

    function loadDrifts() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    function saveDrifts(drifts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(drifts));
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function renderMusicCard(music) {
      if (!music || !music.title) return '';
      const defaultImage = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect fill="%23D9D0E8" width="100" height="100"/%3E%3Ctext x="50" y="67" font-size="40" text-anchor="middle" fill="white"%3E◌%3C/text%3E%3C/svg%3E';
      const imageUrl = music.imageUrl || defaultImage;
      return `
        <div class="music-card">
          <img class="music-card-image" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(music.title)}" onerror="this.src='${defaultImage}'">
          <div class="music-card-info">
            <div class="music-card-title">${escapeHtml(music.title)}</div>
            ${music.artist ? `<div class="music-card-artist">${escapeHtml(music.artist)}</div>` : ''}
            ${music.linkUrl ? `<a href="${escapeHtml(music.linkUrl)}" target="_blank" class="music-card-link">◌ listen →</a>` : ''}
          </div>
        </div>
      `;
    }

    function renderDriftEntries() {
      const container = document.getElementById('driftListContainer');
      if (!container) return;
      const drifts = loadDrifts();
      if (drifts.length === 0) {
        container.innerHTML = '<div class="empty-drift">◌ no drifts yet — write something above ◌</div>';
        return;
      }
      const sorted = [...drifts].sort((a, b) => b.timestamp - a.timestamp);
      container.innerHTML = sorted.map(drift => {
        const date = new Date(drift.timestamp);
        const formatted = `${date.toLocaleDateString()} · ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
        const typeBadge = drift.type ? `<span class="type-badge">${escapeHtml(drift.type)}</span>` : '';
        const musicHtml = drift.music ? renderMusicCard(drift.music) : '';
        return `
          <div class="drift-card">
            <div class="drift-content">${escapeHtml(drift.content).replace(/\n/g, '<br>')}</div>
            ${musicHtml}
            <div class="drift-meta">
              <div>${typeBadge} <span>${formatted}</span></div>
              <button class="delete-drift" data-id="${drift.id}">✖ remove</button>
            </div>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.delete-drift').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const newDrifts = loadDrifts().filter(d => d.id !== id);
          saveDrifts(newDrifts);
          renderDriftEntries();
        });
      });
    }

    const publishBtn = document.getElementById('publishDriftBtn');
    const contentInput = document.getElementById('driftContentInput');
    const typeInput = document.getElementById('driftTypeInput');

    publishBtn?.addEventListener('click', () => {
      const content = contentInput?.value || '';
      const type = typeInput?.value || '';
      const music = getCurrentMusic();
      if (!content.trim() && !music) {
        alert('please write something or add music.');
        return;
      }
      const drifts = loadDrifts();
      drifts.push({
        id: Date.now().toString() + '-' + Math.random().toString(36).substring(2, 8),
        content: content.trim() || '◌ shared a track ◌',
        type: type.trim() || (music ? 'music' : ''),
        music: music,
        timestamp: Date.now()
      });
      saveDrifts(drifts);
      if (contentInput) contentInput.value = '';
      if (typeInput) typeInput.value = '';
      if (musicFields) musicFields.classList.remove('active');
      document.getElementById('musicTitle').value = '';
      document.getElementById('musicArtist').value = '';
      document.getElementById('musicImageUrl').value = '';
      document.getElementById('musicLinkUrl').value = '';
      renderDriftEntries();
    });

    renderDriftEntries();
  </script>
  <script src="scripts.js"></script>
</body>
</html>
